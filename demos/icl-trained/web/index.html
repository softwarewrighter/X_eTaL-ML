<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>In-Context Learning, Trained</title>
  <link data-trunk rel="rust" data-bin="icl-trained-web" />
  <link data-trunk rel="copy-file" href="../../../images/xetal-logo-orange.png" />
  <link data-trunk rel="icon" href="../../../images/favicon.ico" />
  <link data-trunk rel="css" href="../../../shared/microscope/microscope.css" />
  <style>
    .bars.icl { height: 150px; gap: 2px; }
    .bars.icl .bar span { writing-mode: vertical-rl; transform: rotate(180deg); height: 44px; text-align: left; font-size: .7rem; }
    .bars.icl .bar b { font-size: .62rem; font-weight: 500; color: var(--muted); }
    .bars.icl .bar.match .fill { background: #f59f00; }
    .bars.icl .bar.slot .fill { background: #9775fa; }
    .bars.icl .bar.rest .fill { background: #ced4da; }
    .bars.icl .bar.match span { color: #e8590c; font-weight: 700; }
    .prompt { font-family: var(--mono, monospace); font-size: .85rem; line-height: 1.9; }
    .prompt .demo { margin-right: .9em; white-space: nowrap; }
    .prompt .cls { display: inline-block; min-width: 1.2em; text-align: center; border-radius: 3px; color: #fff; font-size: .7rem; padding: 0 3px; margin-right: 2px; }
    .prompt .lab { font-weight: 700; }
    .prompt .lab.answer { color: #e8590c; }
    table.heads td { width: 4.2em; text-align: center; font-size: .8rem; }
    table.zs td, table.zs th { font-size: .78rem; padding: 2px 6px; }
    .controls select { margin-left: 4px; }
    svg.curve { width: 100%; height: auto; background: #fff; border: 1px solid var(--line, #dee2e6); }
  </style>
</head>
<body></body>
</html>
