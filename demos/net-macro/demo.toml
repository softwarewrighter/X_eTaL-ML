# One demo's description: read by scripts/demos.py for the tests, the
# README's demo list and the live catalog (pages/index.html).
slug = "net-macro"            # the directory name, demos/<slug>/
title = "Network macro"
summary = "A network written as one line: a macro library reads a spec such as \"2 16 relu 16 relu 3 softmax\" when the program is compiled and writes the forward function in its place, as ordinary code you can read. Three networks on one task, a spiral: a line, a small network, a deep one. Type a spec of your own and see what the macro writes, or refuses."
concepts = ["macro libraries (.xtlm)", "xetal expand", "matrix product", "softmax by row"]        # the X_eTaL ideas it shows
status = "live"             # draft | live | deferred
order = 50                  # position in the catalog (lower first)
needs = []                   # asks in docs/xetal-asks.md it waits on or works around
line = "u:d_eep := \"2 16 relu 16 relu 3 softmax\" net:n_etwork< \"c1 c2 c3\""
why = "The line is a macro call: before the program is compiled it becomes the forward function written out, three matrix products and their activations, which is then type-checked like any code. The notation is new; the language underneath is not."
