[package]
name = "ternary-net-web"
description = "A 1.58-bit network in the browser: one tiny classifier run by X_eTaL with FP32, FP16, INT8 and ternary weights, compared"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement"] }
console_error_panic_hook = "0.1"

[workspace]
