# Every Cargo workspace in this repo (tools/, demos/*/web/, shared/, site/)
# builds into the one ./target: cargo finds this file by walking up from
# where it runs. The pinned X_eTaL CLI builds into target/xetal/
# (scripts/xetal.sh sets CARGO_TARGET_DIR).
[build]
target-dir = "target"

# The browser runs the evaluator on its stack (WebAssembly has no
# threads): give it room for deep recursion, as X_eTaL's live demo does.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=67108864"]
