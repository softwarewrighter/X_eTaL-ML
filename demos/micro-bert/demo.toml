slug = "micro-bert"            # the directory name, demos/<slug>/
title = "Tiny BERT"
summary = "The encoder half of a transformer in X_eTaL: 2 layers, 16 numbers wide, 2 attention heads, 7,594 weights trained to fill a blank letter in baby names, each letter looking both ways. Type a name with a blank and see the letters it would put there and where each head looks; one encoder layer is a pipeline applied twice, and the model is drawn in one line of math."
