[package]
name = "xetal-ml-libraries"
description = "The libraries of X_eTaL-ML on the live site: every library's reference, source and types, and its demos runnable and editable in the browser (adapted from X_eTaL-libraries' site)"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
xetal-play = { path = "../work/xetal/components/web/crates/xetal-play" }
xetal-store = { path = "../work/xetal/components/base/crates/xetal-store" }
xetal-view = { path = "../work/xetal/components/view/crates/xetal-view" }
xetal-program = { path = "../work/xetal/components/macro/crates/xetal-program" }
xetal-macro = { path = "../work/xetal/components/macro/crates/xetal-macro" }
xetal-clock = { path = "../work/xetal/components/base/crates/xetal-clock" }
xetal-webclock = { path = "../work/xetal/components/web/crates/xetal-webclock" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["Window", "Location", "EventTarget", "HtmlTextAreaElement"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[build-dependencies]
xetal-view = { path = "../work/xetal/components/view/crates/xetal-view" }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[dev-dependencies]
xetal-grid = { path = "../work/xetal/components/view/crates/xetal-grid" }

[workspace]
