<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activation Functions</title>
  <link data-trunk rel="rust" data-bin="activations-web" />
  <link data-trunk rel="copy-file" href="../../../images/xetal-logo-orange.png" />
  <link data-trunk rel="icon" href="../../../images/favicon.ico" />
  <link data-trunk rel="css" href="../../../shared/microscope/microscope.css" />
  <style>
    .sliders { gap: 18px; }
    .slider { display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
    .pair .picture { flex: 1 1 420px; }
    .pair .picture svg { max-width: none; }
    .running { display: flex; align-items: center; gap: 12px; padding: 28px 4px; }
    .spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    textarea.editor { width: 100%; font-family: "JuliaMono", "DejaVu Sans Mono", Menlo, ui-monospace, monospace; font-size: 0.95em; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    pre.err { color: var(--c-error, #c92a2a); white-space: pre-wrap; }
  </style>
</head>
<body></body>
</html>
