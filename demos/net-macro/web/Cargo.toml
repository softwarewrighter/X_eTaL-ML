[package]
name = "net-macro-web"
description = "The network macro: a network written as one line, the function the macro wrote, and what it computes"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
gloo-timers = "0.3"
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
console_error_panic_hook = "0.1"

[workspace]
