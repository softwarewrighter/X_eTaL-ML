[package]
name = "cnn-backprop-web"
description = "Training a CNN in the browser: X_eTaL trains a tiny convolutional network on 600 handwritten digits, live, its filters and readings changing as it learns"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement"] }
console_error_panic_hook = "0.1"

[workspace]
