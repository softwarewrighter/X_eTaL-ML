<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipelines</title>
  <link data-trunk rel="rust" data-bin="pipelines-web" />
  <link data-trunk rel="copy-file" href="../../../images/xetal-logo-orange.png" />
  <link data-trunk rel="icon" href="../../../images/favicon.ico" />
  <link data-trunk rel="css" href="../../../shared/microscope/microscope.css" />
  <!-- KaTeX (shared/katex) draws the equation's LaTeX; where it has not
       loaded, the LaTeX shows as text. -->
  <link data-trunk rel="copy-dir" href="../../../shared/katex" />
  <link rel="stylesheet" href="katex/katex.min.css" />
  <script defer src="katex/katex.min.js"></script>
  <script>
    function drawTex() {
      if (!window.katex) return;
      document.querySelectorAll(".tex[data-tex]").forEach(function (el) {
        if (el.dataset.drawn === el.dataset.tex) return;
        try { katex.render(el.dataset.tex, el, { displayMode: true, throwOnError: false, trust: function (c) { return c.command === "\\htmlClass"; } }); el.dataset.drawn = el.dataset.tex; } catch (e) {}
      });
    }
    // data-tex changed in place too (a choice redrawn, nothing added).
    new MutationObserver(drawTex).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-tex"] });
    window.addEventListener("load", drawTex);
  </script>
  <style>
    /* A stage of a pipeline drawn as math, clickable; the one chosen. */
    .st { cursor: pointer; border-radius: 3px; padding: 0 2px; position: relative; z-index: 1; }
    .st:hover { outline: 1px dashed var(--accent); }
    .st-on { background: rgba(255, 138, 76, 0.22); outline: 1px solid var(--sel); }
    .stages { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    .stages button { background: var(--off); color: var(--on); border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 0.85em; cursor: pointer; }
    .stages button:hover { border-color: var(--accent); }
    .stages button.on { border-color: var(--sel); color: var(--sel); }
    table.items { margin: 0 0 6px 0; }
    .solids { touch-action: none; cursor: grab; user-select: none; }
    .solids .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .solids figure.solid { margin: 0; max-width: 100%; }
    .solids svg { max-width: 100%; height: auto; }
    .solids svg .edge { stroke: rgba(128, 128, 128, 0.7); stroke-dasharray: 3 3; fill: none; }
    .solids svg text { fill: var(--on); font-size: 11px; }
    .solids figcaption { font-size: 0.8em; max-width: 240px; }
    .solids .arrow { font-size: 1.6em; color: var(--accent); }
    table.items td { padding: 2px 6px; text-align: right; font-variant-numeric: tabular-nums; color: #111; }
  </style>
</head>
<body></body>
</html>
