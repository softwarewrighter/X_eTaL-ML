[package]
name = "backprop-web"
description = "The backprop microscope: one training step of a small network run by X_eTaL, every array and gradient shown and checked"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
console_error_panic_hook = "0.1"

[workspace]
